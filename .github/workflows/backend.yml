name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tk_delivery_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tk_delivery_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: PostgreSQL integration tests
        env:
          TK_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/tk_delivery_test?sslmode=disable
        run: go test ./... -count=1 -v

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: API public load smoke
        env:
          APP_ENV: development
          HTTP_ADDR: 127.0.0.1:18080
          APP_PUBLIC_BASE_URL: http://127.0.0.1:18080
          MEDIA_DIR: ${{ runner.temp }}/tk-media
          POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/tk_delivery_test?sslmode=disable
          NOTIFICATION_DRY_RUN: "true"
          SERVER_TIMING_ENABLED: "true"
          POSTGRES_MAX_CONNS: "8"
          POSTGRES_MIN_CONNS: "1"
          PERF_BASE_URL: http://127.0.0.1:18080
          PERF_MAX_P95_MS: "500"
          # Three endpoints plus ETag checks must stay below the 240/minute public-read limiter.
          PERF_CONCURRENCY: "1,10,20"
          PERF_CHECKOUT_ITERATIONS: "12"
          PERF_CHECKOUT_CONCURRENCY: "3"
          PERF_CHECKOUT_MAX_P95_MS: "500"
          PERF_ALLOW_LOCAL_BASE_URL: "true"
        run: |
          mkdir -p "$MEDIA_DIR/menu"
          cp docs/menu_assets_from_telegram/production_media/*.jpg "$MEDIA_DIR/menu/"
          go run ./backend/cmd/app > api.log 2>&1 &
          api_pid=$!
          run_public_api_checks() {
            node scripts/cors-contract.mjs
            node scripts/production-contract.mjs
            node scripts/load-smoke.mjs
          }
          cleanup() {
            status=$?
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              cat api.log
            fi
            return "$status"
          }
          trap cleanup EXIT
          for attempt in {1..60}; do
            if curl -fsS "$PERF_BASE_URL/health" >/dev/null; then
              run_public_api_checks
              exit $?
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              exit 1
            fi
            sleep 1
          done
          curl -fsS "$PERF_BASE_URL/health"
          run_public_api_checks

      - name: Vet
        run: go vet ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Docker build
        run: docker build --build-arg APP_BUILD_SHA=${{ github.sha }} -f deploy/Dockerfile .

  deploy:
    needs: backend
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.TK_DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.TK_DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.TK_DEPLOY_SSH_KEY }}
      DEPLOY_PATH: ${{ secrets.TK_DEPLOY_PATH }}
    steps:
      - name: Check deploy configuration
        id: deploy_config
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_PATH" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Backend deploy skipped: TK_DEPLOY_HOST, TK_DEPLOY_USER, TK_DEPLOY_SSH_KEY or TK_DEPLOY_PATH is not configured."
            exit 0
          fi
          case "$DEPLOY_PATH" in
            ""|"/"|"/opt"|"/home"|"/srv")
              echo "Unsafe TK_DEPLOY_PATH: $DEPLOY_PATH" >&2
              exit 1
              ;;
          esac
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.deploy_config.outputs.enabled == 'true' }}
        uses: actions/checkout@v4

      - name: Install SSH key
        if: ${{ steps.deploy_config.outputs.enabled == 'true' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/tk_deploy_key
          chmod 600 ~/.ssh/tk_deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync source to VPS
        if: ${{ steps.deploy_config.outputs.enabled == 'true' }}
        run: |
          rsync -az \
            --exclude .git \
            --exclude node_modules \
            --exclude 'apps/*/dist' \
            -e "ssh -i ~/.ssh/tk_deploy_key" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Deploy backend on VPS
        if: ${{ steps.deploy_config.outputs.enabled == 'true' }}
        run: |
          ssh -i ~/.ssh/tk_deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH/deploy' && APP_BUILD_SHA='${{ github.sha }}' docker compose --env-file .env.production -p takolako -f docker-compose.api.yml up -d --build --remove-orphans && docker compose --env-file .env.production -p takolako -f docker-compose.api.yml exec -T app wget -qO- http://127.0.0.1:8080/ready >/dev/null && sh ./maintenance.sh"
