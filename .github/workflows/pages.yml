name: Deploy GitHub Pages preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build client Mini App
        run: pnpm --filter @tk-delivery/client build
        env:
          VITE_APP_ENV: staging
          VITE_DEMO_MODE: "true"

      - name: Build kitchen Mini App
        run: pnpm --filter @tk-delivery/kitchen build
        env:
          VITE_APP_ENV: staging
          VITE_DEMO_MODE: "true"

      - name: Build courier Mini App
        run: pnpm --filter @tk-delivery/courier build
        env:
          VITE_APP_ENV: staging
          VITE_DEMO_MODE: "true"

      - name: Build admin Mini App
        run: pnpm --filter @tk-delivery/admin build
        env:
          VITE_APP_ENV: staging
          VITE_DEMO_MODE: "true"

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages/kitchen pages/courier pages/admin
          cp -R apps/client/dist/. pages/
          cp -R apps/kitchen/dist/. pages/kitchen/
          cp -R apps/courier/dist/. pages/courier/
          cp -R apps/admin/dist/. pages/admin/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Mini Apps
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
