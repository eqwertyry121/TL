name: Deploy GitHub Pages preview

on:
  workflow_run:
    workflows:
      - Backend CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Optimization contract checks
        run: pnpm check

      - name: API deployment diagnostics
        env:
          PERF_BASE_URL: https://api.takolako.site
          PERF_EXPECTED_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: pnpm perf:deployment-diagnostics

      - name: Build client Mini App
        run: pnpm --filter @tk-delivery/client build
        env:
          VITE_APP_ENV: production
          VITE_DEMO_MODE: "false"
          VITE_API_BASE_URL: https://api.takolako.site
          VITE_BASE_PATH: "/"
          VITE_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          VITE_LEGAL_BUSINESS_NAME: ${{ vars.LEGAL_BUSINESS_NAME }}
          VITE_LEGAL_REGISTRATION_NUMBER: ${{ vars.LEGAL_REGISTRATION_NUMBER }}
          VITE_LEGAL_TAX_ID: ${{ vars.LEGAL_TAX_ID }}
          VITE_LEGAL_VAT_STATUS: ${{ vars.LEGAL_VAT_STATUS }}
          VITE_LEGAL_REGISTERED_ADDRESS: ${{ vars.LEGAL_REGISTERED_ADDRESS }}
          VITE_LEGAL_RESTAURANT_ADDRESS: ${{ vars.LEGAL_RESTAURANT_ADDRESS }}
          VITE_LEGAL_EMAIL: ${{ vars.LEGAL_EMAIL }}
          VITE_LEGAL_PHONE: ${{ vars.LEGAL_PHONE }}

      - name: Build kitchen Mini App
        run: pnpm --filter @tk-delivery/kitchen build
        env:
          VITE_APP_ENV: production
          VITE_DEMO_MODE: "false"
          VITE_API_BASE_URL: https://api.takolako.site
          VITE_BASE_PATH: "/kitchen/"
          VITE_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Build courier Mini App
        run: pnpm --filter @tk-delivery/courier build
        env:
          VITE_APP_ENV: production
          VITE_DEMO_MODE: "false"
          VITE_API_BASE_URL: https://api.takolako.site
          VITE_BASE_PATH: "/courier/"
          VITE_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Build admin Mini App
        run: pnpm --filter @tk-delivery/admin build
        env:
          VITE_APP_ENV: production
          VITE_DEMO_MODE: "false"
          VITE_API_BASE_URL: https://api.takolako.site
          VITE_BASE_PATH: "/admin/"
          VITE_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Check bundle budgets
        run: pnpm perf:budgets

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages/main pages/kitchen pages/courier pages/admin
          cp -R apps/client/dist/. pages/
          cp pages/index.html pages/main/index.html
          cp -R apps/kitchen/dist/. pages/kitchen/
          cp -R apps/courier/dist/. pages/courier/
          cp -R apps/admin/dist/. pages/admin/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Mini Apps
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
