<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>TK Delivery Mini App</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="shell">
      <section class="panel">
        <p class="eyebrow">Telegram Mini App preview</p>
        <h1>TK Delivery</h1>
        <p class="lead">
          Временный HTTPS-экран для подключения Mini App в Telegram до покупки домена.
        </p>

        <div class="status" id="telegram-status">Проверяем Telegram WebApp...</div>

        <dl class="facts">
          <div>
            <dt>Режим</dt>
            <dd>Stage 0</dd>
          </div>
          <div>
            <dt>Статус</dt>
            <dd>Сбор входных данных</dd>
          </div>
          <div>
            <dt>Заказы</dt>
            <dd>Пока не принимаются</dd>
          </div>
        </dl>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
