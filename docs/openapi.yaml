openapi: 3.1.0
info:
  title: TK Delivery API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:8080/api/v1
security:
  - bearerAuth: []
paths:
  /runtime:
    get:
      security: []
      responses:
        "200":
          description: Runtime settings and schedule state
  /menu:
    get:
      security: []
      parameters:
        - name: locale
          in: query
          schema:
            type: string
            enum: [ru, sr, en]
      responses:
        "200":
          description: Visible non-archived menu
  /dev/session:
    post:
      security: []
      responses:
        "200":
          description: Development-only session
  /auth/telegram:
    post:
      security: []
      responses:
        "200":
          description: Telegram initData session
  /orders/calculate:
    post:
      responses:
        "200":
          description: Server-side cart calculation
  /orders:
    get:
      responses:
        "200":
          description: Client order history
    post:
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Created cash order
  /orders/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Client-owned order detail
  /kitchen/orders:
    get:
      responses:
        "200":
          description: NEW orders without phone/address
  /kitchen/orders/{id}/ready:
    post:
      parameters:
        - $ref: "#/components/parameters/orderId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: Order moved to OUT_FOR_DELIVERY
  /courier/orders:
    get:
      responses:
        "200":
          description: OUT_FOR_DELIVERY orders with phone/address
  /courier/orders/{id}/eta:
    post:
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Courier notifies client that delivery is expected in 5, 10, 15 or 20 minutes
  /courier/orders/{id}/delivered:
    post:
      parameters:
        - $ref: "#/components/parameters/orderId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "200":
          description: Order moved to DELIVERED
  /admin/settings/manual-day-off:
    put:
      responses:
        "200":
          description: Manual day-off switch updated
  /admin/dashboard:
    get:
      responses:
        "200":
          description: Admin home cards, current runtime and notification errors
  /admin/menu:
    get:
      responses:
        "200":
          description: Full admin menu including hidden and archived records
  /admin/categories:
    get:
      responses:
        "200":
          description: Admin category list
    post:
      responses:
        "201":
          description: Category created
  /admin/categories/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Category updated with optimistic version check
    delete:
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Empty category deleted, otherwise archived
  /admin/categories/{id}/archive:
    post:
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Category hidden and archived
  /admin/categories/{id}/restore:
    post:
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Category restored from archive and made visible
  /admin/items:
    get:
      responses:
        "200":
          description: Admin dish list
    post:
      responses:
        "201":
          description: Dish created
  /admin/items/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Dish updated with optimistic version check
    delete:
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Unused dish deleted, used dish archived
  /admin/items/{id}/archive:
    post:
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Dish hidden and archived
  /admin/items/{id}/restore:
    post:
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Dish restored from archive and made visible
  /admin/uploads/menu-photo:
    post:
      responses:
        "201":
          description: JPEG/PNG/WebP menu photo decoded, stripped and stored as PNG
  /admin/settings:
    get:
      responses:
        "200":
          description: Safe admin settings without secrets
    put:
      responses:
        "200":
          description: Safe admin settings updated
  /admin/schedule:
    get:
      responses:
        "200":
          description: Weekly restaurant schedule
    put:
      responses:
        "200":
          description: Weekly restaurant schedule replaced after validation
  /admin/orders:
    get:
      responses:
        "200":
          description: Admin order console with status/date/search filters
  /admin/orders/{id}:
    get:
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Admin order detail with PII and events
  /admin/orders/{id}/cancel:
    post:
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Admin cancels active order with required reason
  /admin/orders/{id}/return-to-new:
    post:
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Admin returns OUT_FOR_DELIVERY order to NEW
  /admin/orders/{id}/contact:
    put:
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Admin edits phone/address with audit redaction
  /admin/orders/{id}/resend:
    post:
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Admin creates a notification retry job
  /admin/orders/{id}/note:
    post:
      parameters:
        - $ref: "#/components/parameters/orderId"
      responses:
        "200":
          description: Admin adds internal note
  /admin/staff:
    get:
      responses:
        "200":
          description: Staff list
    post:
      responses:
        "201":
          description: Staff role added by numeric Telegram ID
  /admin/staff/{id}:
    put:
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: Staff role updated, with last ADMIN and one courier checks
  /admin/analytics:
    get:
      responses:
        "200":
          description: Simple PostgreSQL analytics
  /admin/analytics.csv:
    get:
      responses:
        "200":
          description: CSV export without phone/address
  /admin/audit:
    get:
      responses:
        "200":
          description: Safe admin audit log
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    orderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
