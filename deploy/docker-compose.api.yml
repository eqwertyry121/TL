services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tk_delivery
      POSTGRES_USER: tk_delivery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tk_delivery_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tk_delivery -d tk_delivery"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      HTTP_ADDR: :8080
      POSTGRES_DSN: postgres://tk_delivery:${POSTGRES_PASSWORD}@postgres:5432/tk_delivery?sslmode=disable
      MEDIA_DIR: /app/uploads
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-18080}:8080"
    volumes:
      - tk_delivery_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  tk_delivery_pg:
  tk_delivery_uploads:
