# Add these locations inside the existing api.takolako.site server block.
# Keep the media location before the generic test API proxy.

location ^~ /testbranch-api/media/ {
    alias /srv/tk-delivery-test/uploads/;
    autoindex off;
    gzip off;
    etag on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ^~ /testbranch-api/ {
    rewrite ^/testbranch-api(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
